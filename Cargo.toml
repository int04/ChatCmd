[package]
name = "chat-cmd-client"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/chatcmd-core",
    "crates/chatcmd-storage",
    "crates/chatcmd-runtime",
    "crates/chatcmd-mcp",
]
resolver = "3"

[features]
default = []
embedded-web = ["dep:rust-embed"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chatcmd-core = { path = "crates/chatcmd-core" }
chatcmd-mcp = { path = "crates/chatcmd-mcp" }
chatcmd-runtime = { path = "crates/chatcmd-runtime" }
chatcmd-storage = { path = "crates/chatcmd-storage" }
futures-util = "0.3"
hkdf = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "8"
p256 = { version = "0.13", features = ["ecdh"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rust-embed = { version = "8", optional = true, features = ["compression"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
sysinfo = "0.37"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
png = "0.17"
tray-icon = "0.24"
webbrowser = "1"
winit = "0.30"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
