[package]
name = "chatcmd-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
chatcmd-runtime = { path = "../chatcmd-runtime" }
http = "1"
rmcp = { version = "3.1.4", features = ["server", "client", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["limit", "util"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3"
